<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1b2e">
  <title>CodeQuest</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CodeQuest">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/vendor/qrcode.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-link>CodeQuest</a>
    <div class="stats" id="stats" hidden>
      <span class="streak" id="streak" title="Days in a row"></span>
      <span class="level" id="level"></span>
      <span class="xpbar" title="XP to next level"><span id="xpfill"></span></span>
      <span class="xp" id="xp"></span>
    </div>
  </header>
  <main id="app"><p class="loading">Loading…</p></main>

  <dialog id="pin-dialog">
    <form method="dialog" id="pin-form">
      <h2>Enter PIN</h2>
      <p>This CodeQuest asks for a PIN before running code.</p>
      <input id="pin-input" inputmode="numeric" autocomplete="off" required>
      <button class="btn primary" type="submit">Unlock</button>
    </form>
  </dialog>

  <dialog id="phone-dialog">
    <form method="dialog">
      <h2>Open on your phone or tablet</h2>
      <p>Connect it to the same Wi-Fi as this computer, then scan the code or type the address.</p>
      <div id="qr"></div>
      <ul id="lan-urls"></ul>
      <p class="muted">Tip: in the phone's browser menu, choose <strong>Add to Home Screen</strong> to get a CodeQuest app icon.</p>
      <button class="btn" type="submit">Close</button>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
